services:
  - type: web
    name: pose-iq-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: gunicorn api.app:app
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: poseiq
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.6
